<style>
/* ==========================================================
ALSACE CAM v2 — design system
Noir / blanc, rouge réservé au live, à l'itinéraire, aux alertes
========================================================== */
:root{
--black:#000000; --ink:#0a0a0a; --ink-2:#141414; --ink-3:#1e1e1e;
--line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
--white:#ffffff; --grey:#9a9a9a; --grey-2:#5c5c5c;
--red:#e3001b; --red-2:#ff2d45; --red-glow:rgba(227,0,27,.45);
--glass:rgba(10,10,10,.72); --glass-2:rgba(20,20,20,.86);
--font:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
--radius:18px; --sheet-radius:26px;
--safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
--ease:cubic-bezier(.2,.8,.2,1);
color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:var(--black);color:var(--white);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;}
a{color:inherit;}
#map{position:fixed;inset:0;background:#000;}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.6)!important;color:var(--grey)!important;font-size:10px!important;font-family:var(--font)!important;border-radius:8px 0 0 0!important;}
.maplibregl-ctrl-attrib a{color:var(--grey)!important;}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--safe-bottom) + 118px)!important;right:0!important;}
.maplibregl-ctrl-bottom-left{display:none;}
.maplibregl-canvas{outline:none;}
.splash{position:fixed;inset:0;z-index:999;background:#08080a;overflow:hidden;touch-action:none;transition:opacity .6s var(--ease),visibility .6s;}
.splash.hide{opacity:0;visibility:hidden;}
#splashMesh{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:1;animation:canvasIn 2s ease both;}
@keyframes canvasIn{from{opacity:0}to{opacity:1}}
.scontent{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center;pointer-events:none;}
.scontent [style*='--i']{animation:sreveal 1s var(--ease) both;animation-delay:calc(.35s + var(--i,0)*.14s);}
@keyframes sreveal{0%{opacity:0;transform:translateY(26px) scale(.95);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.sbadge{display:flex;align-items:center;justify-content:center;}
.laurel{display:block;width:32px;height:50px;flex:none;color:#fff;opacity:.4;}
.laurel--l{margin-right:-12px;}
.laurel--r{margin-left:-12px;transform:scaleX(-1);}
.sbadge__c{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 7px;}
.sbadge__l{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:10.5px;letter-spacing:.04em;color:#ffffffa0;white-space:nowrap;text-transform:uppercase;}
.sstars{display:flex;gap:2px;}
.sstars svg{width:12px;height:12px;fill:#ffffff59;}
.stitle{margin:24px 0 0;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(3rem,14vw,5.2rem);line-height:1;letter-spacing:-.02em;color:#fff;}
.stitle__hl{color:var(--red);}
.ssub{margin:18px 0 0;max-width:22rem;font-size:13.5px;line-height:1.6;color:#ffffff66;font-family:var(--font);}
.sload{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:11px;}
.sbar{width:180px;height:3px;background:#ffffff1a;border-radius:3px;overflow:hidden;}
.sbar i{display:block;height:100%;width:0%;background:var(--red);border-radius:3px;transition:width .25s linear;box-shadow:0 0 12px var(--red-glow);}
.splash .step{font-family:var(--mono);font-size:.6rem;color:#ffffff55;letter-spacing:.16em;text-transform:uppercase;min-height:1em;}
.topbar{position:fixed;left:0;right:0;top:0;z-index:40;padding:calc(10px + var(--safe-top)) 14px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;}
.topbar > *{pointer-events:auto;}
.search{display:flex;align-items:center;gap:12px;background:var(--glass-2);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.55);animation:slideDown .6s var(--ease) both;}
.search .brand{width:34px;height:34px;border-radius:10px;background:var(--white);display:grid;place-items:center;flex:0 0 auto;}
.search .brand svg{width:19px;height:19px;}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--white);font-size:.95rem;font-weight:500;font-family:inherit;}
.search input::placeholder{color:var(--grey);}
.search .kbd{font-family:var(--mono);font-size:.64rem;color:var(--grey);border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;flex:0 0 auto;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;animation:slideDown .7s var(--ease) both;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:100px;background:var(--glass-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);color:var(--white);font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s;}
.chip:active{transform:scale(.96);}
.chip .n{font-family:var(--mono);font-size:.66rem;color:var(--grey);background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px;}
.chip[aria-pressed="true"]{background:var(--white);color:var(--black);border-color:var(--white);}
.chip[aria-pressed="true"] .n{color:var(--black);background:rgba(0,0,0,.08);}
.chip .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--red-glow);}
@keyframes slideDown{0%{transform:translateY(-16px);opacity:0}100%{transform:none;opacity:1}}
.ctrls{position:fixed;right:14px;z-index:40;top:calc(var(--safe-top) + 128px);display:flex;flex-direction:column;gap:10px;}
.ctrl{width:44px;height:44px;border-radius:14px;background:var(--glass-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);color:var(--white);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .15s,background .2s;}
.ctrl:active{transform:scale(.92);}
.ctrl svg{width:20px;height:20px;}
.ctrl.on{background:var(--white);color:var(--black);}
.ctrl.stack{display:flex;flex-direction:column;width:44px;height:auto;padding:0;overflow:hidden;}
.ctrl.stack button{width:44px;height:44px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;}
.ctrl.stack button + button{border-top:1px solid var(--line);}
.ctrl.stack button svg{width:18px;height:18px;}
#compass svg{transition:transform .3s var(--ease);}
.mk{width:38px;height:38px;cursor:pointer;}
.mk .ring{position:absolute;inset:0;border-radius:50%;background:var(--white);color:var(--black);border:3px solid var(--black);box-shadow:0 6px 18px rgba(0,0,0,.6);display:grid;place-items:center;transition:transform .2s var(--ease);}
.mk .ring svg{width:18px;height:18px;}
.mk .pulse{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--red);opacity:0;pointer-events:none;}
.mk.active .pulse{animation:pulse 2.2s ease-out infinite;}
.mk .badge{position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--black);background:var(--red);}
.mk:hover .ring,.mk.active .ring{transform:scale(1.15);}
.mk.active .ring{box-shadow:0 0 0 4px var(--red-glow),0 6px 18px rgba(0,0,0,.6);}
.mk .lbl{position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;font-size:.68rem;font-weight:700;color:var(--white);text-shadow:0 1px 2px #000,0 0 8px #000;pointer-events:none;letter-spacing:.01em;transition:opacity .25s;}
body.z-far .mk .lbl{opacity:0;}
body.z-far .mk{width:26px;height:26px;}
body.z-far .mk .ring svg{width:13px;height:13px;}
body.z-far .mk .pulse{width:26px;height:26px;margin:-13px 0 0 -13px;}
body.z-far .mk .badge{width:10px;height:10px;}
@keyframes pulse{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.me{width:22px;height:22px;border-radius:50%;background:#2f80ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,128,255,.25),0 4px 12px rgba(0,0,0,.5);}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 0 calc(12px + var(--safe-bottom));pointer-events:none;transition:transform .35s var(--ease),opacity .3s;}
.dock .rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 14px;scrollbar-width:none;pointer-events:auto;}
.dock .rail::-webkit-scrollbar{display:none;}
.card{flex:0 0 82%;max-width:360px;scroll-snap-align:center;background:var(--glass-2);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.55);transition:border-color .2s,transform .15s;}
.card:active{transform:scale(.98);}
.card.active{border-color:var(--red);}
.card .ic{width:46px;height:46px;border-radius:13px;flex:0 0 auto;background:var(--white);color:var(--black);display:grid;place-items:center;position:relative;}
.card .ic svg{width:22px;height:22px;}
.card .ic .dot{position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink-2);background:var(--red);}
.card .t{min-width:0;flex:1;}
.card .t .n{font-weight:700;font-size:.9rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .t .s{font-size:.74rem;color:var(--grey);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .t .s b{color:var(--white);font-weight:600;}
.card .arrow{color:var(--grey);flex:0 0 auto;}
.card .arrow svg{width:18px;height:18px;}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
.scrim.show{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:92dvh;background:var(--glass-2);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--line-2);border-bottom:0;border-radius:var(--sheet-radius) var(--sheet-radius) 0 0;transform:translateY(110%);transition:transform .42s var(--ease);display:flex;flex-direction:column;box-shadow:0 -20px 60px rgba(0,0,0,.6);will-change:transform;}
.sheet.show{transform:translateY(0);}
.sheet .grab{flex:0 0 auto;padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none;}
.sheet .grab i{width:42px;height:5px;border-radius:5px;background:var(--line-2);display:block;}
.sheet .body{overflow-y:auto;overscroll-behavior:contain;padding:6px 18px calc(22px + var(--safe-bottom));display:flex;flex-direction:column;gap:14px;}
.sheet .head{display:flex;align-items:flex-start;gap:12px;}
.sheet .head .titles{min-width:0;flex:1;}
.sheet h2{margin:0;font-size:1.28rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance;}
.sheet .sub{font-size:.8rem;color:var(--grey);margin-top:4px;}
.sheet .x{width:36px;height:36px;border-radius:50%;flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--white);cursor:pointer;display:grid;place-items:center;}
.sheet .x svg{width:16px;height:16px;}
.status{display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:100px;width:fit-content;border:1px solid rgba(227,0,27,.4);color:var(--red-2);background:rgba(227,0,27,.1);}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.player{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;background:#000;border:1px solid var(--line);}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.player .pl-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
.player .live-tag{position:absolute;right:10px;top:10px;z-index:2;background:var(--red);color:#fff;font-size:.64rem;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:6px;pointer-events:none;}
.player .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--grey);font-size:.78rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;}
.player .loading i{display:block;width:26px;height:26px;border:2px solid var(--line-2);border-top-color:var(--red);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.fact{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;}
.fact .k{font-family:var(--mono);font-size:.6rem;color:var(--grey);letter-spacing:.08em;text-transform:uppercase;}
.fact .v{font-size:.9rem;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fact .v.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.desc{font-size:.9rem;line-height:1.55;color:#d6d6d6;margin:0;}
.legal{border-left:3px solid var(--red);padding:10px 14px;background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;font-size:.78rem;line-height:1.5;color:var(--grey);}
.legal b{color:var(--white);}
.credit{font-size:.7rem;color:var(--grey);text-align:center;}
.credit a{color:var(--grey);}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:.9rem;text-decoration:none;cursor:pointer;border:1px solid var(--line-2);background:rgba(255,255,255,.06);color:var(--white);transition:transform .15s,background .2s;}
.btn:active{transform:scale(.97);}
.btn svg{width:18px;height:18px;}
.btn.red{background:var(--red);color:#fff;border-color:var(--red);}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-bottom));z-index:90;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--white);color:var(--black);font-weight:600;font-size:.84rem;padding:11px 16px;border-radius:100px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .3s var(--ease);pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.results{background:var(--glass-2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:none;max-height:40dvh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.55);}
.results.show{display:block;}
.res{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);}
.res:last-child{border-bottom:0;}
.res:hover{background:rgba(255,255,255,.05);}
.res .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--red);}
.res .n{font-weight:600;font-size:.88rem;}
.res .l{font-size:.72rem;color:var(--grey);}
.res .km{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--grey);}
@media (min-width:900px){
.topbar{left:0;right:auto;width:420px;}
.dock{left:0;right:auto;width:420px;padding-left:0;}
.dock .rail{flex-direction:column;overflow:visible;padding:0 14px 14px;max-height:52dvh;overflow-y:auto;}
.card{flex:0 0 auto;max-width:none;}
.sheet{left:auto;right:16px;bottom:16px;width:440px;border-radius:var(--sheet-radius);border-bottom:1px solid var(--line-2);max-height:calc(100dvh - 32px);}
.sheet .grab{display:none;}
.sheet .body{padding-top:18px;}
.ctrls{top:auto;bottom:140px;}
.maplibregl-ctrl-bottom-right{bottom:0!important;}
.toast{bottom:40px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.dock{bottom:var(--vpb,0px);}
.toast{bottom:calc(140px + var(--safe-bottom) + var(--vpb,0px));}
.pcap{font-size:.72rem;line-height:1.45;color:var(--grey);text-align:center;}
.pcap b{color:var(--white);font-weight:600;}
.pcap a{color:var(--grey);}
.pfs{position:absolute;left:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:#fff;display:grid;place-items:center;cursor:pointer;}
.pfs svg{width:17px;height:17px;}
.x.fav{color:var(--grey-2);}
.x.fav svg{width:19px;height:19px;opacity:.6;}
.x.fav.on{color:var(--red);}
.x.fav.on svg{opacity:1;}
.cfav{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--grey-2);font-size:1.05rem;cursor:pointer;line-height:1;transition:all .15s;}
.cfav.on{color:var(--red);border-color:rgba(227,0,27,.45);background:rgba(227,0,27,.1);}
.cfav:active{transform:scale(.9);}
.secret-btn{color:var(--red)!important;font-size:1.15rem;font-weight:800;}
.tourbar{position:fixed;left:50%;bottom:calc(152px + var(--safe-bottom) + var(--vpb,0px));transform:translateX(-50%);z-index:85;display:none;background:var(--red);color:#fff;border:none;padding:11px 20px;border-radius:100px;font-weight:700;font-size:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;}
.tourbar.show{display:block;}
.secret{position:fixed;left:0;right:0;bottom:0;z-index:72;background:var(--glass-2);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--line-2);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(120%);transition:transform .42s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.6);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--vpb,0px));}
.secret.show{transform:translateY(0);}
.secret .grab{padding:10px 0 2px;display:grid;place-items:center;}

.secret .shead{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.15rem;margin:6px 2px 14px;letter-spacing:.01em;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

@media(min-width:900px){.secret{left:auto;right:16px;width:440px;bottom:16px;border-radius:26px;border-bottom:1px solid var(--line-2);}}
.wall{position:fixed;inset:0;z-index:95;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

<div class="head">
<div class="titles"><h2 id="sh-title">${c.name}</h2><div class="sub">${c.loc}</div></div>
<button class="x fav" id="favBtn" aria-label="Favori" aria-pressed="false" onclick="toggleFav(current)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.3l-5.4 3 1-6-4.4-4.2 6-.9L12 3l2.8 6.2 6 .9-4.4 4.2 1 6z"/></svg></button>
<button class="x" id="closeSheet" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<span class="status"><i></i>En direct · intégré</span>
${playerHTML(c)}
<div class="facts">
<div class="fact"><div class="k">${mePos?'De moi':'De Strasbourg'}</div><div class="v num">${d.toFixed(1)} km</div></div>
<div class="fact"><div class="k">Type</div><div class="v">${CAT[c.cat]}</div></div>
<div class="fact"><div class="k">Source</div><div class="v">${SRC(c)}</div></div>
</div>
<p class="desc">${c.desc}</p>
<div class="actions">
<a class="btn red" href="${gm}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>Itinéraire</a>
<a class="btn" href="${c.link}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5"/></svg>Source</a>
</div>`;
$('#closeSheet').onclick=close;
refreshFavBtn();
$('#sheet').classList.add('show'); $('#scrim').classList.add('show');
$('#sheet .body').scrollTop=0;
}
function close(){
$('#sheet').classList.remove('show'); $('#scrim').classList.remove('show');
setTimeout(()=>{ if(!$('#sheet').classList.contains('show')) $('#sheetBody').innerHTML=''; }, 450); // coupe le live
$$('.mk').forEach(m=>m.classList.remove('active')); $$('.card').forEach(m=>m.classList.remove('active'));
current=null;
}
$('#scrim').onclick=()=>{ close(); closeSecret(); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ close(); closeSecret(); closeWall(); stopTour(); } });
function goFs(btn){ const pl=btn.closest('.player'); if(!pl) return; const fn=pl.requestFullscreen||pl.webkitRequestFullscreen; if(fn){ try{ fn.call(pl); }catch(e){} } }
function fitVP(){ var vv=window.visualViewport; if(!vv) return; var gap=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); document.documentElement.style.setProperty('--vpb', gap+'px'); }
if(window.visualViewport){ visualViewport.addEventListener('resize',fitVP); visualViewport.addEventListener('scroll',fitVP); }
window.addEventListener('resize',fitVP); setTimeout(fitVP,200); fitVP();
function openSecret(){ document.getElementById('secret').classList.add('show'); $('#scrim').classList.add('show'); }
function closeSecret(){ const el=document.getElementById('secret'); if(el) el.classList.remove('show'); if(!$('#sheet').classList.contains('show')) $('#scrim').classList.remove('show'); }
function surprise(){ closeSecret(); const pool=CAMS; const c=pool[Math.floor(Math.random()*pool.length)]; if(c) open(c.id); }
let tour=null;
function startTour(){ closeSecret(); stopTour(); const list=filtered().length?filtered():CAMS; let i=0; toast('Balade auto lancée'); const tb=document.getElementById('tourbar'); if(tb) tb.classList.add('show'); const go=()=>{ open(list[i%list.length].id); i++; }; go(); tour=setInterval(go,11000); }
function stopTour(){ if(tour){ clearInterval(tour); tour=null; toast('Balade arrêtée'); } const tb=document.getElementById('tourbar'); if(tb) tb.classList.remove('show'); }
function openWall(){ closeSecret(); const pool=CAMS.filter(c=>c.status==='windy'); const used=new Set(), pick=[]; let guard=0; while(pick.length<6 && guard++<200){ const k=Math.floor(Math.random()*pool.length); if(used.has(k))continue; used.add(k); pick.push(pool[k]); } const g=document.getElementById('wallGrid'); g.innerHTML=pick.map(c=>`<div class="wcell"><iframe src="https://webcams.windy.com/webcams/public/embed/player/${c.windy}/day" loading="lazy" title="${c.name}"></iframe><span class="wlbl">${c.name}</span><button class="wopen" data-id="${c.id}" aria-label="Ouvrir en grand">⤢</button></div>`).join(''); g.querySelectorAll('.wopen').forEach(b=> b.onclick=()=>{ closeWall(); open(b.dataset.id); }); document.getElementById('wall').classList.add('show'); }
function closeWall(){ const w=document.getElementById('wall'); if(!w) return; w.classList.remove('show'); setTimeout(()=>{ if(!w.classList.contains('show')){ const g=document.getElementById('wallGrid'); if(g) g.innerHTML=''; } },300); }
function showFav(){ filter='fav'; $$('.chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.f==='fav')); apply(); closeSecret(); }
(()=>{
const sheet=$('#sheet'), grab=$('#grab'); let y0=null, dy=0;
const start=e=>{ y0=(e.touches?e.touches[0]:e).clientY; dy=0; sheet.style.transition='none'; };
const move=e=>{ if(y0===null) return; dy=Math.max(0,(e.touches?e.touches[0]:e).clientY-y0); sheet.style.transform=`translateY(${dy}px)`; };
const end=()=>{ if(y0===null) return; sheet.style.transition=''; sheet.style.transform=''; if(dy>110) close(); y0=null; };
grab.addEventListener('touchstart',start,{passive:true}); grab.addEventListener('touchmove',move,{passive:true}); grab.addEventListener('touchend',end);
grab.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
})();
</script>
</body>
</html>
